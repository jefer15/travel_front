<div class="container">
  <h2>Resumen del Viaje</h2>
  <p><strong>Destino: </strong> {{ selectedCountry?.name }}, {{ selectedCity?.name }}</p>
  <p><strong>Presupuesto en COP: </strong> {{ budget }}</p>
  <p><strong>Clima actual: </strong> {{ weather }} °C</p>
  <p><strong>Tasa de cambio:</strong> 1 COP = {{ exchangeRate }} {{ currencySymbol }}</p>
  <p><strong>Presupuesto convertido:</strong> {{ currencySymbol }} {{ convertedAmount.toFixed(2) }}</p>

  <button class="btn btn-primary mt-3" routerLink="/">Volver al inicio</button>
</div>
