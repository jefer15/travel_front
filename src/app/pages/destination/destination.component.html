<div class="container">
  <h2>Selecciona un destino</h2>
  <div class="form-group">
    <label for="country">País:</label>
    <select class="form-control" id="country" [(ngModel)]="selectedCountry" (change)="getCitiesByCountry()">
      <option *ngFor="let country of countries" [value]="country.id">{{ country.name }}</option>
    </select>
  </div>

  <div class="form-group mt-2">
    <label for="city">Ciudad:</label>
    <select class="form-control" id="city" [(ngModel)]="selectedCity" [disabled]="!selectedCountry">
      <option *ngFor="let city of cities" [value]="city.id">{{ city.name }}</option>
    </select>
  </div>

  <button class="btn btn-primary mt-3" (click)="goToNextPage()">Siguiente</button>
</div>
